name: tably
description: "Tably — planifie tes dîners selon ton budget, tes envies et ce qu'il y a dans ta cuisine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  sign_in_with_apple: ^7.0.1

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2

  # Analytics
  posthog_flutter: ^5.3.0

  crypto: ^3.0.6
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/photos/
