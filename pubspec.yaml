name: tably
description: "Tably — planifie tes dîners selon ton budget, tes envies et ce qu'il y a dans ta cuisine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.0
  sign_in_with_apple: ^7.0.1

  # Paywall
  superwallkit_flutter: ^2.4.12

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  liquid_glass_widgets: ^0.30.2

  # Analytics
  mixpanel_flutter: ^2.13.0

  crypto: ^3.0.6
  intl: any
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.7
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/photos/
    - assets/brand/
    - assets/stores/
    - assets/decor/

# Native launch screen — regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  background_image: assets/brand/gradient_splash.png
  image: assets/brand/logo_splash.png
  android: false
  web: false

# App icon — regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: false
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
