name: tably
description: "Tably — planifie tes dîners selon ton budget, tes envies et ce qu'il y a dans ta cuisine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.0
  sign_in_with_apple: ^7.0.1

  # Paywall
  superwallkit_flutter: ^2.4.12

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  liquid_glass_widgets: ^0.30.2

  # Analytics
  posthog_flutter: ^5.3.0

  crypto: ^3.0.6
  intl: any
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.7
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/photos/
    - assets/brand/
    - assets/stores/

# Native launch screen — regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash.png
  web: false
